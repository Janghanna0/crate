<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;
  --card:#ffffff;
  --line:#e7e8ee;
  --ink:#14161c;
  --ink-dim:#5c616d;
  --ink-faint:#9aa0ab;
  --brand:#4f46e5;
  --brand-soft:#eeecfd;
  --sans:'Pretendard-Regular','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);}
mark{background:#fde68a;color:#1f2937;padding:0 2px;border-radius:3px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:60;
  background:rgba(244,245,248,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:20px 4vw 16px;
}
.header-inner{max-width:1400px;margin:0 auto;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em;}
h1 .count{color:var(--brand);}
.stat{font-size:12.5px;color:var(--ink-faint);}

.search-row{display:flex;gap:10px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:260px;}
.search-box input{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  color:var(--ink);font-size:15px;padding:12px 42px 12px 42px;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search-box input::placeholder{color:var(--ink-faint);}
.search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.search-box svg.icon-search{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-faint);}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;border:none;background:var(--line);color:var(--ink-dim);
  cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;
}

.tag-scroll{
  margin-top:12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
}
.tag-scroll::-webkit-scrollbar{display:none;}
.chip{
  flex:none;font-size:13px;font-weight:600;color:var(--ink-dim);background:#fff;
  border:1.5px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;white-space:nowrap;
  transition:all .12s ease;
}
.chip:hover{border-color:var(--brand);color:var(--brand);}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ---------- Grid : uniform-height cards ---------- */
main{max-width:1400px;margin:0 auto;padding:22px 4vw 80px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(268px, 1fr));
  gap:18px;
}

.course-card{
  height:352px;
  display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.course-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,22,30,0.08);border-color:#dcdeea;}
.course-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

.card-strip{
  flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:relative;overflow:hidden;
}
.card-strip .mono{
  position:absolute;right:-4px;bottom:-20px;font-size:64px;font-weight:800;line-height:1;
  color:rgba(255,255,255,0.35);user-select:none;
}
.badge{
  position:relative;z-index:1;
  display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;
  padding:4px 9px;letter-spacing:.01em;background:rgba(0,0,0,0.16);
}
.card-count{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.92);}

.card-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px 12px;}
.card-title{
  flex:none;font-size:15.5px;font-weight:800;line-height:1.4;color:var(--ink);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:10px;min-height:43px;
}

.ep-preview{flex:1;min-height:0;display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.ep-row{
  display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:7px;
  transition:background .1s ease;flex:none;
}
.ep-row:hover{background:#f5f4ff;}
.ep-row:hover .ep-label{color:var(--brand);}
.ep-no{flex:none;width:18px;text-align:right;font-size:11.5px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.ep-label{flex:1;font-size:12.8px;line-height:1.4;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.card-foot{flex:none;margin-top:auto;padding-top:8px;}
.more-btn{
  width:100%;text-align:center;background:var(--brand-soft);border:none;border-radius:8px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--brand);padding:9px 4px;
}
.more-btn:hover{background:#e2ddfb;}

.single-cta{
  flex:none;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand-soft);border-radius:8px;padding:10px 4px;
  font-size:13px;font-weight:700;color:var(--brand);
}
.single-cta svg{width:13px;height:13px;stroke:var(--brand);}

.empty-state{padding:100px 20px;text-align:center;color:var(--ink-faint);font-size:15px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:200;background:rgba(15,15,20,0.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  width:100%;max-width:640px;background:#fff;border-radius:18px;overflow:hidden;
  animation:rise .2s ease;box-shadow:0 30px 70px rgba(0,0,0,0.28);
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}

.modal-hero{position:relative;padding:30px 28px 22px;overflow:hidden;}
.modal-hero .mono{position:absolute;right:-8px;top:-26px;font-size:150px;font-weight:800;color:rgba(255,255,255,0.22);line-height:1;}
.modal-close{
  position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;
  border:none;background:rgba(255,255,255,0.25);color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  transition:background .15s ease;
}
.modal-close:hover{background:rgba(255,255,255,0.42);}
.modal-tag{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.9);letter-spacing:.03em;margin-bottom:8px;}
.modal-title{position:relative;z-index:1;font-size:21px;font-weight:800;line-height:1.4;color:#fff;padding-right:28px;}
.modal-sub{position:relative;z-index:1;margin-top:9px;font-size:12.5px;color:rgba(255,255,255,0.85);}

.ep-list{list-style:none;padding:10px 12px 22px;max-height:54vh;overflow-y:auto;}
.ep-list::-webkit-scrollbar{width:8px;}
.ep-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.ep-item{
  display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:9px;text-decoration:none;color:inherit;
  transition:background .12s ease;
}
.ep-item:hover{background:#f5f4ff;}
.ep-item:hover .ep-item-title{color:var(--brand);}
.ep-item-no{width:26px;flex:none;text-align:center;font-size:13px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.ep-item-title{flex:1;font-size:13.8px;line-height:1.5;color:var(--ink-dim);}
.ep-item-go{width:13px;height:13px;flex:none;stroke:var(--ink-faint);}
.ep-item:hover .ep-item-go{stroke:var(--brand);}

footer{text-align:center;padding:22px;color:var(--ink-faint);font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <h1><span class="count" id="courseCount">136</span>개의 강의</h1>
      <div class="stat" id="stat"></div>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="강의명 또는 회차 내용으로 검색" autocomplete="off">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
    </div>
    <div class="tag-scroll" id="tagScroll"></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">일치하는 강의가 없습니다.</div>
</main>

<footer>회차 미리보기를 클릭하면 바로 이동, 카드를 클릭하면 전체 회차를 볼 수 있어요</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hero" id="modalHero">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="mono" id="modalMono"></div>
      <div class="modal-tag" id="modalTag"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-sub" id="modalSub"></div>
    </div>
    <ul class="ep-list" id="epList"></ul>
  </div>
</div>

const grid = document.getElementById('grid');

const stat = document.getElementById('stat');

const totalEpisodes = DATA.reduce((s,c)=>s+c.count,0);
stat.textContent = `총 ${DATA.length}개 강의 · ${totalEpisodes}개 강의영상`;

const allTags = Array.from(new Set(DATA.map(c=>c.tag))).sort((a,b)=>a.localeCompare(b,'ko'));
let activeTag = '전체';
let query = '';
const PREVIEW_LIMIT = 4;

function esc(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function highlight(text, q){
  if(!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return esc(text);
  return esc(text.slice(0,idx)) + '<mark>' + esc(text.slice(idx, idx+q.length)) + '</mark>' + esc(text.slice(idx+q.length));
}

function renderChips(){
  const chips = ['전체', ...allTags];
  tagScroll.innerHTML = chips.map(t=>
    `<button class="chip ${t===activeTag?'active':''}" data-tag="${esc(t)}">${esc(t)}</button>`
  ).join('');
  tagScroll.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeTag = el.dataset.tag;
      renderChips();
      renderGrid();
    });
  });
}

    const label = e ? e.label : '';
    const labelHtml = (q && label.toLowerCase().includes(q)) ? highlight(label,q) : esc(label);
    return `
      <div class="course-card" data-name="${esc(c.name)}">
        <div class="card-strip" style="background:${c.c}">
          <span class="badge">${esc(c.tag)}</span>
          <div class="mono">${esc(c.mono)}</div>
        </div>
        <div class="card-body">
          <div class="card-title">${titleHtml}</div>
          <div class="ep-preview">
            <div class="ep-row" data-url="${e.url}">
              <span class="ep-no">1</span>
              <span class="ep-label">${labelHtml}</span>
            </div>
          </div>
          <div class="card-foot">
            <div class="single-cta">
              강의 보러가기
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  const visible = c.episodes.slice(0, PREVIEW_LIMIT);
  const remaining = c.count - visible.length;

  const rowHtml = e => `
    <div class="ep-row" data-url="${e.url}">
      <span class="ep-no">${e.no}</span>
      <span class="ep-label">${(q && e.label.toLowerCase().includes(q)) ? highlight(e.label,q) : esc(e.label)}</span>
    </div>
  `;

  return `
    <div class="course-card" data-name="${esc(c.name)}">
      <div class="card-strip" style="background:${c.c}">
        <span class="badge">${esc(c.tag)}</span>
        <span class="card-count">총 ${c.count}강</span>
        <div class="mono">${esc(c.mono)}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${titleHtml}</div>
        <div class="ep-preview">${visible.map(rowHtml).join('')}</div>
        <div class="card-foot">
          <button class="more-btn" type="button">${remaining > 0 ? `+ ${remaining}개 회차 더보기` : '전체 회차 보기'}</button>
        </div>
      </div>
    </div>
  `;
}

function renderGrid(){
  const q = query.trim().toLowerCase();
  const filtered = DATA.filter(c=>{
    const matchesTag = activeTag === '전체' || c.tag === activeTag;
    const matchesQuery = !q || c.name.toLowerCase().includes(q) || c.episodes.some(e=>e.label.toLowerCase().includes(q));
    return matchesTag && matchesQuery;
  });

  courseCount.textContent = filtered.length;

  if(filtered.length === 0){
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  grid.innerHTML = filtered.map(c => cardHtml(c, q)).join('');

  grid.querySelectorAll('.course-card').forEach(el=>{
    const course = DATA.find(c=>c.name === el.dataset.name);

    // whole-card click opens modal (full list)
    el.addEventListener('click', (e)=>{
      // if the click landed on an episode preview row, go straight to that link instead
      const row = e.target.closest('.ep-row');
      if(row){
        window.open(row.dataset.url, '_blank', 'noopener,noreferrer');
        return;
      }
      const q2 = query.trim();
      const epMatch = q2 ? course.episodes.find(ep=>ep.label.toLowerCase().includes(q2)) : null;
      openModal(course, epMatch ? epMatch.no : null);
    });
    el.setAttribute('tabindex','0');
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); openModal(course, null); }
    });
  });
}

const overlay = document.getElementById('overlay');
const modalHero = document.getElementById('modalHero');
const modalMono = document.getElementById('modalMono');
const modalTag = document.getElementById('modalTag');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const epList = document.getElementById('epList');
let lastFocused = null;

function openModal(course, highlightNo){
  lastFocused = document.activeElement;
  modalHero.style.background = course.c;
  modalMono.textContent = course.mono;
  modalTag.textContent = course.tag;
  modalTitle.textContent = course.name;
  modalSub.textContent = course.count > 1 ? `전체 ${course.count}개 회차` : '단편 강의 · 회차 구분 없음';

  epList.innerHTML = course.episodes.map(e => `
    <li>
      <a class="ep-item" href="${e.url}" target="_blank" rel="noopener noreferrer" data-no="${e.no}">
        <span class="ep-item-no">${e.no}</span>
        <span class="ep-item-title">${e.no === highlightNo ? highlight(e.label, query.trim()) : esc(e.label)}</span>
        <svg class="ep-item-go" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
      </a>
    </li>
  `).join('');

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modalClose').focus();

  if(highlightNo){
    requestAnimationFrame(()=>{
      const t = epList.querySelector(`[data-no="${highlightNo}"]`);
      if(t) t.scrollIntoView({block:'center'});
    });
  }
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if(lastFocused) lastFocused.focus();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

let debounceTimer;
searchInput.addEventListener('input', e=>{
  query = e.target.value;
  searchClear.style.display = query ? 'flex' : 'none';
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderGrid, 70);
});
searchClear.addEventListener('click', ()=>{
  searchInput.value=''; query=''; searchClear.style.display='none'; renderGrid(); searchInput.focus();
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==searchInput){ e.preventDefault(); searchInput.focus(); }
});

renderChips();
renderGrid();
</script>
</body>
</html>
