<style>
  :root {

    --surface: #13131a;

    --border: #2a2a3d;
    --accent: #df0e0e;
    --accent2: #f5c842;
    --text: #e8e8f0;
    --text-muted: #6b6b85;
    --new: #3ecf8e;
    --ai: #a78bfa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  .header {
    padding: 60px 48px 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .header-logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .header h1 span { color: var(--accent); }
  .header-meta {
    text-align: right;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.8;
  }
  .header-meta strong {
    font-size: 36px;
    font-weight: 800;
    color: var(--accent2);
    display: block;
    letter-spacing: -0.04em;
  }

  /* ─── CATEGORY TABS ─── */
  .tabs-wrapper {
    padding: 28px 48px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 0;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 10px 20px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.2s;
    position: relative;
    bottom: -1px;
    border: 1px solid transparent;
    border-bottom: none;
  }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.active {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);
    border-bottom-color: var(--surface);
  }

  /* ─── SECTION ─── */
  .section {
    display: none;
    padding: 40px 48px 60px;
  }
  .section.active { display: block; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
  }
  .section-count {
    font-size: 13px;
    color: var(--text-muted);
  }
  .nav-btns {
    display: flex;
    gap: 8px;
  }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--accent); border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn:disabled:hover { background: var(--surface); border-color: var(--border); }

  /* ─── CAROUSEL ─── */
  .carousel-outer {
    overflow: hidden;
    border-radius: 12px;
  }
  .carousel-track {
    display: flex;
    gap: 20px;
    transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }
  .carousel-track--grid {
    display: grid;
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    grid-auto-columns: calc((100% - 100px) / 5);
  }

  /* ─── CARD ─── */
  .card {
    flex: 0 0 calc((100% - 100px) / 5);
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(233, 20, 20, 0.15);
  }
  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
  }
  .card-thumb-svg {
    width: 100%;
    aspect-ratio: 16/9;
    display: block;
  }
  .card-body {
    padding: 20px 16px 16px;
  }
  .card-badges {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge-sub {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .badge-ai {
    background: rgba(167, 139, 250, 0.15);
    color: var(--ai);
    border: 1px solid rgba(167, 139, 250, 0.3);
  }
  .badge-new {
    background: rgba(62, 207, 142, 0.15);
    color: var(--new);
    border: 1px solid rgba(62, 207, 142, 0.3);
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .card-meta-item {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .card-meta-item svg { opacity: 0.6; }

  @media (max-width: 900px) {
    .header { padding: 40px 24px 28px; flex-direction: column; align-items: flex-start; gap: 16px; }

    .tabs-wrapper { padding: 20px 24px 0; }
    .section { padding: 28px 24px 48px; }
    .card { flex: 0 0 calc((100% - 20px) / 2); }

  }
  @media (max-width: 600px) {

    .carousel-track--grid { grid-auto-columns: 85%; }
  }
</style>

// SVG thumbnail generator
function makeThumbnail(course) {
  const [c1, c2] = course.theme;
  const lines = course.title.match(/.{1,19}/g) || [course.title];
  const snippet = lines.slice(0,3).map(l => l.trim());
  const shapes = [
    `<circle cx="240" cy="90" r="70" fill="${c1}" opacity="0.25"/>`,
    `<rect x="0" y="85" width="320" height="1" stroke="${c2}" stroke-width="0.5" opacity="0.3"/>`,
    `<circle cx="30" cy="30" r="40" fill="${c2}" opacity="0.12"/>`,
  ];
  const textLines = snippet.map((t, i) =>
    `<text x="20" y="${30 + i * 22}" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.95">${escapeXml(t)}</text>`
  ).join('');
  return `<svg class="card-thumb-svg" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g${course.no}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:${c1};stop-opacity:1"/>
        <stop offset="100%" style="stop-color:${c2};stop-opacity:0.7"/>
      </linearGradient>
    </defs>
    <rect width="320" height="180" fill="url(#g${course.no})"/>
    ${shapes.join('')}
    ${textLines}
    <text x="20" y="162" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="11" fill="white" opacity="0.6">${escapeXml(course.sub)}</text>
  </svg>`;
}

function escapeXml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function makeCard(course) {
  const badges = [
    `<span class="badge badge-sub">${course.sub}</span>`,
    course.ai ? `<span class="badge badge-ai">🤖 AI활용</span>` : '',
    course.new ? `<span class="badge badge-new">🆕 신규</span>` : '',
  ].join('');
  return `<div class="card">
    <div class="card-thumb">${makeThumbnail(course)}</div>
    <div class="card-body">
      <div class="card-badges">${badges}</div>
      <div class="card-title">${course.title}</div>
      <div class="card-meta">
        <span class="card-meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${course.hours}
        </span>
        <span class="card-meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 00-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 004 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/></svg>
          강의 ${course.count}개
        </span>
        <span class="card-meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          ${course.tools || '-'}
        </span>
      </div>
    </div>
  </div>`;
}

// Build DOM
const tabsEl = document.getElementById('tabs');
const sectionsEl = document.getElementById('sections');

CATEGORIES.forEach((cat, idx) => {
  // Tab
  const tab = document.createElement('button');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.textContent = cat.label;
  tab.dataset.idx = idx;
  tab.addEventListener('click', () => switchTab(idx));
  tabsEl.appendChild(tab);

  // Section
  const section = document.createElement('div');
  section.className = 'section' + (idx === 0 ? ' active' : '');
  section.id = 'section-' + idx;

  const isGrid = cat.id === 'ai';
  const perPage = isGrid ? 5 : 3;
  let page = 0;
  const total = cat.courses.length;
  const totalCols = isGrid ? Math.ceil(total / 2) : total;
  const maxPage = Math.max(0, Math.ceil(totalCols / perPage) - 1);

  section.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">${cat.label}</div>
        <div class="section-count">총 ${cat.count}개 강의</div>
      </div>
      <div class="nav-btns">
        <button class="nav-btn prev-btn" data-sec="${idx}" disabled>←</button>
        <button class="nav-btn next-btn" data-sec="${idx}" ${totalCols <= perPage ? 'disabled' : ''}>→</button>
      </div>
    </div>
    <div class="carousel-outer">
      <div class="carousel-track${isGrid ? ' carousel-track--grid' : ''}" id="track-${idx}">
        ${cat.courses.map(c => makeCard(c)).join('')}
      </div>
    </div>
  `;
  sectionsEl.appendChild(section);

  // Nav logic
  section.querySelector('.prev-btn').addEventListener('click', () => move(idx, -1));
  section.querySelector('.next-btn').addEventListener('click', () => move(idx, +1));
});

const pageState = CATEGORIES.map(() => 0);

function move(secIdx, dir) {
  const cat = CATEGORIES[secIdx];
  const isGrid = cat.id === 'ai';
  const perPage = isGrid ? 5 : 3;
  const total = cat.courses.length;
  const totalCols = isGrid ? Math.ceil(total / 2) : total;
  const maxPage = Math.max(0, Math.ceil(totalCols / perPage) - 1);
  pageState[secIdx] = Math.max(0, Math.min(maxPage, pageState[secIdx] + dir));
  const track = document.getElementById('track-' + secIdx);
  const cardW = track.children[0].offsetWidth + 20;
  track.style.transform = `translateX(-${pageState[secIdx] * perPage * cardW}px)`;
  const section = document.getElementById('section-' + secIdx);
  section.querySelector('.prev-btn').disabled = pageState[secIdx] === 0;
  section.querySelector('.next-btn').disabled = pageState[secIdx] >= maxPage;
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.section').forEach((s, i) => s.classList.toggle('active', i === idx));
}
